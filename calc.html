<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" id="themeColor">
<title>calc. — The Calculator Better Than Yours</title>
<style>
:root{
  --bg:#f5f5f7; --display:#ffffff; --btn:#ffffff; --btn-op:#e5e5ea;
  --btn-eq:#ff9500; --fg:#1c1c1e; --label-fg:#3a3a3c;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 15% 5%, color-mix(in srgb, var(--btn-eq) 14%, var(--bg)), transparent 30rem), var(--bg); color:var(--fg); font-family:ui-rounded, "SF Pro Rounded", "Avenir Next", Arial, sans-serif;
  transition:background .25s ease;
}
.app{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,310px); gap:16px;
  padding:24px; max-width:820px; width:100%;
}
.app-header{ grid-column:1 / -1; display:flex; align-items:baseline; justify-content:space-between; padding:0 4px; }
.brand{ display:flex; align-items:center; gap:9px; font-size:25px; font-weight:800; letter-spacing:-.06em; }
.brand-mark{ display:grid; place-items:center; width:28px; height:28px; border-radius:9px; background:var(--btn-eq); color:#fff; font-size:21px; box-shadow:0 5px 14px color-mix(in srgb, var(--btn-eq) 36%, transparent); }
.tagline{ color:var(--label-fg); font-size:12px; font-weight:700; letter-spacing:.02em; }
.display-row{
  grid-column:1 / -1; display:flex; gap:8px; align-items:stretch;
}
.display{
  flex:1; background:var(--display); color:var(--fg);
  border-radius:12px; padding:16px 18px; font-size:26px; text-align:right;
  min-height:78px; word-break:break-all; box-shadow:0 12px 30px rgba(0,0,0,.09); border:1px solid color-mix(in srgb, var(--fg) 8%, transparent);
  display:flex; align-items:center; justify-content:flex-end; font-variant-numeric:tabular-nums;
}
.copy-btn{
  border:none; border-radius:12px; padding:0 16px; font-size:18px; cursor:pointer;
  background:var(--btn-op); color:var(--fg); box-shadow:0 8px 18px rgba(0,0,0,.10);
  transition:filter .15s ease, transform .05s ease;
}
.copy-btn:hover{ filter:brightness(1.08); }
.copy-btn:active{ transform:scale(.92); }
.copy-status{
  grid-column:1/-1; text-align:right; font-size:12px; font-weight:700; color:#34c759;
  height:14px; margin-top:-4px;
}
.version-tag{
  grid-column:1/-1; text-align:center; font-size:11px; color:var(--label-fg);
  opacity:.55; margin-top:2px; letter-spacing:.02em;
}
.pad-tabs{ grid-column:1/-1; display:flex; gap:6px; }
.pad-tabs button{
  flex:1; border:1px solid color-mix(in srgb, var(--fg) 7%, transparent); border-radius:12px 12px 0 0;
  padding:9px 4px; font-size:12px; font-weight:800; letter-spacing:.02em; cursor:pointer;
  color:var(--label-fg); background:color-mix(in srgb, var(--display) 50%, transparent);
  box-shadow:none; transition:background .15s ease, color .15s ease;
}
.pad-tabs button[aria-selected="true"]{
  color:var(--fg); background:color-mix(in srgb, var(--display) 68%, transparent);
  box-shadow:0 -2px 0 var(--btn-eq) inset;
}
.pad-tabs button:hover{ color:var(--fg); }
.pad{
  display:grid; grid-template-columns:repeat(4,1fr); gap:9px; align-content:start; padding:14px; border-radius:0 0 20px 20px;
  background:color-mix(in srgb, var(--display) 68%, transparent); border:1px solid color-mix(in srgb, var(--fg) 7%, transparent); border-top:none; box-shadow:0 12px 30px rgba(0,0,0,.06);
  min-height:290px;
}
.pad button, .roast, .sidebar button{
  border:1px solid color-mix(in srgb, var(--fg) 7%, transparent); border-radius:14px; padding:13px 4px; font-size:15px; font-weight:700;
  cursor:pointer; color:var(--fg); background:var(--btn);
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  transition:transform .05s ease, filter .15s ease, background .2s ease, box-shadow .2s ease;
}
.pad button:hover, .sidebar button:hover{ filter:brightness(1.06); box-shadow:0 2px 5px rgba(0,0,0,.14); }
.pad button:active{ transform:scale(.94); box-shadow:0 1px 1px rgba(0,0,0,.10); }
.pad button:focus-visible, .sidebar button:focus-visible, .roast:focus-visible,
select:focus-visible, .conv-display:focus-visible{
  outline:2px solid var(--btn-eq); outline-offset:2px;
}
.pad button.op{ background:var(--btn-op); }
.pad button.eq{ background:var(--btn-eq); color:#fff; }
.pad button.wide{ grid-column:span 2; }
.roast{
  margin:0; background:#e24b4a; color:#fff;
  padding:10px 13px; border-radius:12px; font-weight:800; cursor:pointer;
  box-shadow:0 5px 14px rgba(226,75,74,.26);
}
.roast:hover{ filter:brightness(1.08); }

@media (max-width:620px){
  body{ align-items:flex-start; }
  .app{ grid-template-columns:1fr; padding:14px; gap:14px; }
  .display{ font-size:22px; }
  .pad button{ min-height:48px; font-size:16px; }
  .sidebar{ display:flex; gap:12px; }
  .sidebar-section{ min-width:0; }
  .sidebar-section.wide{ grid-column:1 / -1; }
}
@media (max-width:390px){ .app-header{ align-items:center; } .tagline{ display:none; } }
.sidebar{ display:flex; flex-direction:column; gap:12px; font-size:13px; padding:15px; border-radius:20px; background:color-mix(in srgb, var(--display) 68%, transparent); border:1px solid color-mix(in srgb, var(--fg) 7%, transparent); box-shadow:0 12px 30px rgba(0,0,0,.06); }
.sidebar-section{ background:color-mix(in srgb, var(--display) 72%, transparent); border-radius:12px; padding:10px; }
.sidebar h4{ margin:6px 0 0; color:var(--label-fg); font-size:12px; letter-spacing:.03em; }
.prog-line{ font-family:'Courier New',monospace; font-weight:700; color:var(--label-fg); }
select, .conv-display, .theme-name-input{
  width:100%; padding:9px; border-radius:10px; border:1px solid color-mix(in srgb, var(--fg) 15%, transparent);
  background:var(--display); color:var(--fg); font-size:13px;
}
.conv-display{ text-align:right; font-size:16px; }
.conv-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:4px; }
.conv-pad button{ padding:8px 0; font-size:13px; }
.conv-pad button.wide{ grid-column:span 3; }
#history{
  list-style:none; margin:0; padding:6px; background:var(--display); border-radius:8px;
  min-height:50px; max-height:70px; overflow-y:auto; font-size:11px; color:var(--fg);
}
#history li{ padding:4px 2px; border-bottom:1px solid rgba(0,0,0,.06); cursor:pointer; border-radius:4px; }
#history li:hover{ background:var(--btn-op); }
#graphCanvas{ width:100%; background:var(--display); border-radius:8px; margin-top:4px; }
.result-line{ font-size:12px; font-weight:700; color:var(--label-fg); }
.theme-gallery{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.theme-gallery[hidden]{ display:none; }
.theme-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:10px; border:1px solid color-mix(in srgb, var(--fg) 15%, transparent); border-radius:10px; background:var(--display); color:var(--fg); font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
.theme-toggle:hover{ border-color:var(--btn-eq); }
.theme-toggle-icon{ color:var(--label-fg); font-size:18px; line-height:.8; transition:transform .2s ease; }
.theme-toggle[aria-expanded="true"] .theme-toggle-icon{ transform:rotate(180deg); }
.theme-chip{ display:flex; align-items:center; gap:6px; min-width:0; padding:7px; border:1px solid transparent; border-radius:10px; background:var(--btn); color:var(--fg); font:inherit; font-size:11px; font-weight:700; cursor:pointer; text-align:left; }
.theme-chip:hover,.theme-chip[aria-pressed="true"]{ border-color:var(--btn-eq); box-shadow:0 0 0 2px color-mix(in srgb, var(--btn-eq) 22%, transparent); }
.theme-swatch{ display:flex; flex:0 0 26px; height:18px; overflow:hidden; border-radius:6px; }
.theme-swatch i{ flex:1; }
.theme-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hint{ color:var(--label-fg); font-size:11px; line-height:1.35; margin:5px 0 0; }
.clear-history{ background:transparent!important; box-shadow:none!important; text-decoration:underline; color:var(--label-fg)!important; font-size:11px!important; padding:3px!important; text-align:left; }

/* Theme studio modal */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:center; justify-content:center; z-index:10;
}
.modal-backdrop.open{ display:flex; }
.modal{
  background:#2c2c2e; color:#fff; border-radius:12px; padding:20px; width:340px;
  max-height:90vh; overflow:auto;
}
.modal h3{ margin-top:0; }
.swatch-row{ display:flex; align-items:center; justify-content:space-between; margin:6px 0; font-size:12px; }
.swatch-row input[type=color]{ width:34px; height:24px; border:none; border-radius:4px; background:none; cursor:pointer; }
.preview-card{ border:2px solid #555; border-radius:8px; padding:10px; margin:10px 0; }
.preview-card .pdisp{ padding:6px; border-radius:6px; text-align:right; font-size:13px; }
.preview-card .prow{ display:flex; gap:6px; margin-top:6px; }
.preview-card .prow span{ flex:1; text-align:center; padding:6px 0; border-radius:6px; font-size:12px; font-weight:700; }
.modal button.save{ width:100%; margin-top:10px; padding:10px; border:none; border-radius:8px; background:#ff9500; color:#fff; font-weight:700; cursor:pointer; }
.modal input[type=text]{ width:100%; padding:6px; border-radius:6px; border:1px solid #555; background:#1c1c1e; color:#fff; margin-bottom:8px;}
@media (max-width:620px){ .sidebar{ display:flex; } .app-header{ padding:0; } }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="brand"><span class="brand-mark">+</span>calc.</div>
    <button class="roast roast-quick" id="roastBtn">🔥 Roast the default</button>
  </header>
  <div class="display-row">
    <output class="display" id="display" aria-live="polite" aria-label="Calculator display">0</output>
    <button class="copy-btn" id="copyBtn" title="Copy result to clipboard" aria-label="Copy display to clipboard">📋</button>
  </div>
  <div class="copy-status" id="copyStatus"></div>

  <div class="pad-tabs" id="padTabs" role="tablist" aria-label="Calculator mode"></div>
  <div class="pad" id="pad" role="tabpanel"></div>

  <div class="sidebar">
    <h4>PROGRAMMER BASE</h4>
    <div class="prog-line" id="hexLine">HEX: -</div>
    <div class="prog-line" id="decLine">DEC: -</div>
    <div class="prog-line" id="octLine">OCT: -</div>
    <div class="prog-line" id="binLine">BIN: -</div>

    <h4>THEME</h4>
    <button class="theme-toggle" id="themeToggle" type="button" aria-expanded="false" aria-controls="themeGallery">
      <span id="currentThemeLabel">Theme: Light</span><span class="theme-toggle-icon" aria-hidden="true">⌄</span>
    </button>
    <div class="theme-gallery" id="themeGallery" aria-label="Theme gallery" hidden></div>
    <button id="createThemeBtn">🎨 Create Theme</button>

    <h4>SOUND PROFILE</h4>
    <select id="soundSelect">
      <option>Mute</option>
      <option>Mechanical Click</option>
      <option>8-Bit Retro</option>
      <option>Laser</option>
      <option>Smooth Chords</option>
    </select>

    <h4>HISTORY</h4>
    <ul id="history"></ul>
    <button class="clear-history" id="clearHistoryBtn">Clear history</button>

    <h4>UNIT CONVERTER</h4>
    <select id="convSelect">
      <option>km -> miles</option>
      <option>miles -> km</option>
      <option>kg -> lb</option>
      <option>lb -> kg</option>
      <option>C -> F</option>
      <option>F -> C</option>
    </select>
    <input class="conv-display" id="convDisplay" readonly value="0">
    <div class="conv-pad" id="convPad"></div>
    <div class="result-line" id="convResult">Result: -</div>

    <h4>GRAPH</h4>
    <button id="plotBtn">Plot Graph (uses display expr)</button>
    <canvas id="graphCanvas" width="220" height="140"></canvas>
    <p class="hint">Try <strong>x²</strong>, <strong>sin(x)</strong>, or <strong>abs(x)</strong>.</p>
  </div>

  <div class="version-tag">calc. — v1.4.2 · JavaScript port</div>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="themeStudioTitle">
  <div class="modal">
    <h3 id="themeStudioTitle">Theme Studio</h3>
    <input type="text" id="themeNameInput" value="My Custom Theme">
    <div id="swatchFields"></div>
    <div class="preview-card" id="previewCard">
      <div class="pdisp" id="previewDisp">123 + 456</div>
      <div class="prow">
        <span id="pB1">7</span><span id="pB2">+</span><span id="pB3">=</span>
      </div>
    </div>
    <button class="save" id="saveThemeBtn">💾 Save &amp; Apply Theme</button>
  </div>
</div>

<script>
// ==========================================
// THEMES
// ==========================================
const DEFAULT_THEMES = {
  "Light": {bg:"#f5f5f7",display:"#ffffff",btn:"#ffffff",btn_op:"#e5e5ea",btn_eq:"#ff9500",fg:"#1c1c1e",label_fg:"#3a3a3c"},
  "Dark": {bg:"#1c1c1e",display:"#2c2c2e",btn:"#3a3a3c",btn_op:"#48484a",btn_eq:"#ff9500",fg:"#ffffff",label_fg:"#ffffff"},
  "Ocean": {bg:"#0b2431",display:"#123847",btn:"#1c4f61",btn_op:"#0e3947",btn_eq:"#00b4d8",fg:"#ffffff",label_fg:"#ffffff"},
  "Midnight Violet": {bg:"#120f18",display:"#1e1829",btn:"#262035",btn_op:"#3b3052",btn_eq:"#8b5cf6",fg:"#f3e8ff",label_fg:"#d8b4fe"},
  "Cyberpunk": {bg:"#0a0a12",display:"#121124",btn:"#1a1836",btn_op:"#2d2759",btn_eq:"#00f0ff",fg:"#00f0ff",label_fg:"#ff007f"},
  "Matcha Latte": {bg:"#f4f6f0",display:"#ffffff",btn:"#e8ede0",btn_op:"#d6e0c7",btn_eq:"#84a98c",fg:"#2f3e46",label_fg:"#52796f"},
  "Vaporwave": {bg:"#1a1030",display:"#28184a",btn:"#3a2361",btn_op:"#4e2f7a",btn_eq:"#ff6ec7",fg:"#7ee8fa",label_fg:"#ff6ec7"},
  "Forest": {bg:"#1b2e1f",display:"#243b29",btn:"#2f4d35",btn_op:"#3d6144",btn_eq:"#a3c586",fg:"#e8f0e3",label_fg:"#a3c586"},
  "Neon Jungle": {bg:"#0a1f0a",display:"#122b12",btn:"#1c421c",btn_op:"#286028",btn_eq:"#39ff14",fg:"#d4ffcc",label_fg:"#39ff14"},
  "Blood Moon": {bg:"#160303",display:"#2b0606",btn:"#3f0a0a",btn_op:"#5c0f0f",btn_eq:"#e50914",fg:"#ffd6d6",label_fg:"#e50914"},
  "Dracula": {bg:"#282a36",display:"#44475a",btn:"#383a4a",btn_op:"#6272a4",btn_eq:"#ff79c6",fg:"#f8f8f2",label_fg:"#bd93f9"},
  "Nord": {bg:"#2e3440",display:"#3b4252",btn:"#434c5e",btn_op:"#4c566a",btn_eq:"#88c0d0",fg:"#eceff4",label_fg:"#8fbcbb"},
  "Solarized Light": {bg:"#fdf6e3",display:"#fffdf4",btn:"#eee8d5",btn_op:"#d9d2bd",btn_eq:"#cb4b16",fg:"#073642",label_fg:"#586e75"},
  "Solarized Dark": {bg:"#002b36",display:"#073642",btn:"#0c4652",btn_op:"#1b5360",btn_eq:"#b58900",fg:"#eee8d5",label_fg:"#93a1a1"},
  "Tokyo Night": {bg:"#1a1b26",display:"#24283b",btn:"#30354d",btn_op:"#3b4261",btn_eq:"#7aa2f7",fg:"#c0caf5",label_fg:"#bb9af7"},
  "Gruvbox": {bg:"#282828",display:"#3c3836",btn:"#504945",btn_op:"#665c54",btn_eq:"#fe8019",fg:"#ebdbb2",label_fg:"#fabd2f"},
  "Catppuccin Mocha": {bg:"#1e1e2e",display:"#313244",btn:"#45475a",btn_op:"#585b70",btn_eq:"#cba6f7",fg:"#cdd6f4",label_fg:"#89b4fa"},
  "Rose Pine": {bg:"#191724",display:"#1f1d2e",btn:"#26233a",btn_op:"#403d52",btn_eq:"#ebbcba",fg:"#e0def4",label_fg:"#c4a7e7"},
  "Sakura": {bg:"#fff5f7",display:"#ffffff",btn:"#ffe4ec",btn_op:"#ffc9d7",btn_eq:"#e86a92",fg:"#4a2635",label_fg:"#a84265"},
  "Espresso": {bg:"#21150f",display:"#342116",btn:"#4a3020",btn_op:"#65432d",btn_eq:"#d99152",fg:"#fff0db",label_fg:"#e4b78c"},
  "Aurora": {bg:"#071a24",display:"#0b2b37",btn:"#124455",btn_op:"#1c5f6e",btn_eq:"#63e6be",fg:"#d8fff4",label_fg:"#91f2d4"},
  "Arctic": {bg:"#eaf4f8",display:"#ffffff",btn:"#dcecf2",btn_op:"#c5dce5",btn_eq:"#3786a8",fg:"#17384a",label_fg:"#39708a"},
  "Sunset": {bg:"#30162c",display:"#48203c",btn:"#642950",btn_op:"#84355e",btn_eq:"#ff9f43",fg:"#fff0e8",label_fg:"#ffbd7a"},
  "Candy": {bg:"#25153d",display:"#382157",btn:"#4d2a74",btn_op:"#66358b",btn_eq:"#ff66b3",fg:"#fff0fb",label_fg:"#ff9ed0"},
  "Terminal": {bg:"#07110a",display:"#0c1b10",btn:"#112b18",btn_op:"#1c4425",btn_eq:"#33ff66",fg:"#b8ffc5",label_fg:"#70f58c"},
  "Lavender Mist": {bg:"#f4f0ff",display:"#ffffff",btn:"#e9e1ff",btn_op:"#d8ccf5",btn_eq:"#8c6fce",fg:"#30284a",label_fg:"#6e5b9a"},
};
let THEMES = JSON.parse(JSON.stringify(DEFAULT_THEMES));
let currentTheme = "Light";
const SECRET_THEME = {bg:"#000000",display:"#111111",btn:"#1a1a1a",btn_op:"#330033",btn_eq:"#ff00ff",fg:"#00ff00",label_fg:"#ff00ff"};
const STORAGE_KEY = "calc.v1.state";
let appReady = false;

function saveState(){
  if(!appReady) return;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      themes: THEMES, currentTheme, history: history.slice(-50), memory, activeTab,
      soundPreset: document.getElementById('soundSelect').value,
    }));
  }catch(e){ /* Storage is optional; calc. still works without it. */ }
}

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!saved || typeof saved !== 'object') return;
    if(saved.themes && typeof saved.themes === 'object') THEMES = {...THEMES, ...saved.themes};
    if(Array.isArray(saved.history)) history = saved.history.filter(x=>typeof x === 'string').slice(-50);
    if(Number.isFinite(saved.memory)) memory = saved.memory;
    if(typeof saved.soundPreset === 'string') soundPreset = saved.soundPreset;
    if(typeof saved.activeTab === 'string' && TABS[saved.activeTab]) activeTab = saved.activeTab;
    if(typeof saved.currentTheme === 'string' && THEMES[saved.currentTheme]) currentTheme = saved.currentTheme;
  }catch(e){ /* Ignore old or corrupt saved settings. */ }
}

function applyTheme(name){
  if(!THEMES[name]) return;
  currentTheme = name;
  const t = THEMES[name];
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--display', t.display);
  r.setProperty('--btn', t.btn);
  r.setProperty('--btn-op', t.btn_op);
  r.setProperty('--btn-eq', t.btn_eq);
  r.setProperty('--fg', t.fg);
  r.setProperty('--label-fg', t.label_fg);
  document.getElementById('themeColor').content = t.bg;
  document.getElementById('currentThemeLabel').textContent = `Theme: ${name}`;
  renderThemeGallery();
  saveState();
}

function refreshThemeSelect(){
  renderThemeGallery();
}

function renderThemeGallery(){
  const gallery = document.getElementById('themeGallery');
  if(!gallery) return;
  gallery.innerHTML = '';
  Object.entries(THEMES).forEach(([name, theme])=>{
    const button = document.createElement('button');
    button.className = 'theme-chip';
    button.type = 'button';
    button.title = `Apply ${name} theme`;
    button.setAttribute('aria-pressed', String(name === currentTheme));
    const swatch = document.createElement('span');
    swatch.className = 'theme-swatch';
    [theme.bg, theme.display, theme.btn_eq].forEach(color=>{
      const stripe = document.createElement('i');
      stripe.style.background = color;
      swatch.appendChild(stripe);
    });
    const label = document.createElement('span');
    label.className = 'theme-name';
    label.textContent = name;
    button.append(swatch, label);
    button.addEventListener('click', ()=>{
      applyTheme(name);
      document.getElementById('themeGallery').hidden = true;
      document.getElementById('themeToggle').setAttribute('aria-expanded', 'false');
    });
    gallery.appendChild(button);
  });
}

// ==========================================
// AUDIO SYNTH (real oscillators + envelopes, not raw sample math)
// ==========================================
let audioCtx = null;
let soundPreset = "Mute";
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// One shaped tone: oscillator -> (optional filter) -> gain envelope -> master
function tone(ctx, master, {wave="sine", freq=440, freqEnd=null, glideTime=null, start=0, dur=0.12,
  attack=0.004, decay=0.08, sustain=0, gain=0.22, filterType=null, filterFreq=2000, filterQ=0.7, detune=0}){
  const osc = ctx.createOscillator();
  osc.type = wave;
  osc.frequency.setValueAtTime(freq, start);
  osc.detune.value = detune;
  if(freqEnd !== null){
    const glide = glideTime !== null ? glideTime : dur;
    osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), start+glide);
  }
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain), start+attack);
  const sustainLevel = Math.max(0.0002, gain*sustain);
  g.gain.exponentialRampToValueAtTime(sustainLevel>0.0002?sustainLevel:0.0002, start+attack+decay);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);

  let node = osc;
  if(filterType){
    const f = ctx.createBiquadFilter();
    f.type = filterType;
    f.frequency.value = filterFreq;
    f.Q.value = filterQ;
    node.connect(f);
    node = f;
  }
  node.connect(g);
  g.connect(master);
  osc.start(start);
  osc.stop(start+dur+0.02);
}

// A short burst of filtered noise, for clicks/snaps.
function noiseBurst(ctx, master, {start=0, dur=0.03, gain=0.18, filterType="highpass", filterFreq=1500, filterQ=0.9}){
  const n = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i] = Math.random()*2-1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = filterType; f.frequency.value = filterFreq; f.Q.value = filterQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(start);
}

function playSound(type="number", key=null){
  if(soundPreset === "Mute") return;
  try{
    const ctx = getCtx();
    const master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);
    const now = ctx.currentTime + 0.001;

    if(soundPreset === "Mechanical Click"){
      // A crisp keyboard-switch click: noise transient + a short low thock.
      const pitch = {operator:1.15, equals:1.3, clear:0.8, number:1}[type] || 1;
      noiseBurst(ctx, master, {start:now, dur:0.012, gain:0.5, filterType:"highpass", filterFreq:3200*pitch, filterQ:0.7});
      tone(ctx, master, {wave:"sine", freq:180*pitch, freqEnd:90*pitch, start:now, dur:0.05,
        attack:0.001, decay:0.02, sustain:0, gain:0.35});
      if(type === "equals"){
        tone(ctx, master, {wave:"sine", freq:900, start:now+0.01, dur:0.06, attack:0.002, decay:0.03, gain:0.12});
      }

    } else if(soundPreset === "Laser"){
      // Smooth descending/ascending sweep with a little shimmer, sci-fi zap.
      const map = {
        operator: {f0:2200, f1:600,  dur:0.09},
        equals:   {f0:500,  f1:2600, dur:0.16},
        clear:    {f0:1400, f1:200,  dur:0.14},
        number:   {f0:1600, f1:500,  dur:0.05},
      };
      const m = map[type] || map.number;
      tone(ctx, master, {wave:"sawtooth", freq:m.f0, freqEnd:m.f1, start:now, dur:m.dur,
        attack:0.002, decay:m.dur*0.6, sustain:0.05, gain:0.14, filterType:"bandpass", filterFreq:1800, filterQ:1.4});
      tone(ctx, master, {wave:"sine", freq:m.f0*1.5, freqEnd:m.f1*1.5, start:now, dur:m.dur*0.8,
        attack:0.002, decay:m.dur*0.4, sustain:0, gain:0.06});

    } else if(soundPreset === "Smooth Chords"){
      // Warm triangle-wave chord stabs with a gentle lowpass, like an EP pad.
      // Every digit 0-9 gets its own chord, walking round the circle of fifths.
      const DIGIT_CHORDS = {
        "0": [261.63, 329.63, 392.00],           // C major
        "1": [293.66, 369.99, 440.00],           // D major
        "2": [329.63, 415.30, 493.88],           // E major
        "3": [349.23, 440.00, 523.25],           // F major
        "4": [392.00, 493.88, 587.33],           // G major
        "5": [440.00, 554.37, 659.25],           // A major
        "6": [493.88, 622.25, 739.99],           // B major
        "7": [261.63, 311.13, 392.00],           // C minor
        "8": [293.66, 349.23, 440.00],           // D minor
        "9": [329.63, 392.00, 493.88],           // E minor
      };
      const chordMap = {
        operator: [523.25, 659.25, 783.99],       // C major (up an octave)
        equals:   [587.33, 739.99, 880.00, 1174.66], // D major (add octave for lift)
        clear:    [392.00, 493.88, 587.33],       // G major, softer resolve
      };
      const notes = (type==="number" && DIGIT_CHORDS[key]) ? DIGIT_CHORDS[key]
        : (chordMap[type] || [440.00, 554.37]);
      const dur = type==="equals" ? 0.55 : (type==="number" ? 0.2 : 0.32);
      notes.forEach((f,i)=>{
        tone(ctx, master, {wave:"triangle", freq:f, start:now, dur:dur,
          attack:0.012, decay:dur*0.5, sustain:0.3, gain:0.11/Math.sqrt(notes.length),
          filterType:"lowpass", filterFreq:3000, filterQ:0.6, detune:(i-1)*2});
      });

    } else { // 8-Bit Retro
      // Classic chiptune pulse-wave blip with a stepped little arpeggio on equals.
      if(type === "equals"){
        [440, 660, 880].forEach((f,i)=>{
          tone(ctx, master, {wave:"square", freq:f, start:now+i*0.045, dur:0.09,
            attack:0.002, decay:0.05, sustain:0.1, gain:0.15, filterType:"lowpass", filterFreq:6000});
        });
      } else {
        const map = {
          operator: {f0:600, f1:1000},
          clear:    {f0:420, f1:180},
          number:   {f0:480, f1:620},
        };
        const m = map[type] || map.number;
        tone(ctx, master, {wave:"square", freq:m.f0, freqEnd:m.f1, start:now, dur:0.07,
          attack:0.002, decay:0.04, sustain:0.1, gain:0.15, filterType:"lowpass", filterFreq:5500});
      }
    }
  }catch(e){ /* ignore audio errors */ }
}

function sanitize(expr){
  return expr
    .replace(/\^/g, "**")
    .replace(/√/g, "sqrt")
    .replace(/π/g, "PI")
    .replace(/τ/g, "(2*PI)")
    .replace(/φ/g, "1.61803398875")
    .replace(/(?<![a-zA-Z])e(?![a-zA-Z(])/g, "E")
    .replace(/\bAND\b/g, "&")
    .replace(/\bXOR\b/g, "^")
    .replace(/\bOR\b/g, "|")
    .replace(/\bLSH\b/g, "<<")
    .replace(/\bRSH\b/g, ">>");
}

// Safe-ish evaluator: only allow digits, operators, parens, and known function names
function safeEval(expr){
  let js = sanitize(expr);
  js = js.replace(/asin/g, "__ASIN__").replace(/acos/g, "__ACOS__").replace(/atan/g, "__ATAN__")
         .replace(/sinh/g, "__SINH__").replace(/cosh/g, "__COSH__").replace(/tanh/g, "__TANH__");
  js = js.replace(/\*\*/g, "__POW__");
  js = js.replace(/sin/g, "Math.sin")
         .replace(/cos/g, "Math.cos")
         .replace(/tan/g, "Math.tan")
         .replace(/log2/g, "Math.log2")
         .replace(/log/g, "Math.log10")
         .replace(/ln/g, "Math.log")
         .replace(/exp/g, "Math.exp")
         .replace(/sqrt/g, "Math.sqrt")
         .replace(/abs/g, "Math.abs")
         .replace(/floor/g, "Math.floor")
         .replace(/ceil/g, "Math.ceil")
         .replace(/round/g, "Math.round")
         .replace(/cbrt/g, "Math.cbrt")
         .replace(/sign/g, "Math.sign")
         .replace(/min/g, "Math.min")
         .replace(/max/g, "Math.max")
         .replace(/hypot/g, "Math.hypot")
         .replace(/PI/g, "Math.PI")
         .replace(/E/g, "Math.E");
  js = js.replace(/__ASIN__/g, "Math.asin").replace(/__ACOS__/g, "Math.acos").replace(/__ATAN__/g, "Math.atan")
         .replace(/__SINH__/g, "Math.sinh").replace(/__COSH__/g, "Math.cosh").replace(/__TANH__/g, "Math.tanh");
  js = js.replace(/__POW__/g, "**");
  // balance parens
  const open = (js.match(/\(/g)||[]).length;
  const close = (js.match(/\)/g)||[]).length;
  if(open>close) js += ")".repeat(open-close);
  if(!/^(?:(?:Math\.(?:sin|cos|tan|asin|acos|atan|sinh|cosh|tanh|log10|log2|log|exp|sqrt|cbrt|abs|sign|floor|ceil|round|min|max|hypot|PI|E))|[0-9+\-*/%,.()\s<>&|^])*$/.test(js)) throw new Error("Invalid expression");
  // eslint-disable-next-line no-new-func
  return Function('"use strict"; return (' + js + ')')();
}

function updateProgDisplay(){
  try{
    const val = Math.trunc(Number(safeEval(expression)));
    if(!Number.isFinite(val)) throw new Error();
    document.getElementById('hexLine').textContent = "HEX: " + (val<0? "-"+Math.abs(val).toString(16).toUpperCase() : val.toString(16).toUpperCase());
    document.getElementById('decLine').textContent = "DEC: " + val;
    document.getElementById('octLine').textContent = "OCT: " + (val<0? "-"+Math.abs(val).toString(8) : val.toString(8));
    document.getElementById('binLine').textContent = "BIN: " + (val<0? "-"+Math.abs(val).toString(2) : val.toString(2));
  }catch(e){
    document.getElementById('hexLine').textContent = "HEX: -";
    document.getElementById('decLine').textContent = "DEC: -";
    document.getElementById('octLine').textContent = "OCT: -";
    document.getElementById('binLine').textContent = "BIN: -";
  }
}

function updateHistory(){
  const ul = document.getElementById('history');
  ul.innerHTML = '';
  history.slice(-8).reverse().forEach(item=>{
    const li = document.createElement('li');
    li.textContent = item;
    li.title = 'Use this calculation again';
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    const useItem = ()=>{
      expression = item.split(' = ')[0];
      setDisplay(expression);
      updateProgDisplay();
    };
    li.addEventListener('click', useItem);
    li.addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); useItem(); } });
    ul.appendChild(li);
  });
  saveState();
}

function setDisplay(text){
  document.getElementById('display').textContent = text;
}

function press(key){
  if(["+","-","*","/","%","^","sin","cos","tan","log","√"].includes(key)) playSound("operator");
  else if(key==="=") playSound("equals");
  else if(["C","del","MC"].includes(key)) playSound("clear");
  else playSound("number", key);

  if(expression === "Error" && !["C","del","MC","MR","M+","M-"].includes(key)) expression = "";
  if(key==="C"){ expression = ""; }
  else if(key==="del"){ expression = expression.slice(0,-1); }
  else if(key==="MC"){ memory = 0; }
  else if(key==="MR"){ expression += String(memory); }
  else if(key==="M+"){ try{ memory += Number(safeEval(expression)); }catch(e){} }
  else if(key==="M-"){ try{ memory -= Number(safeEval(expression)); }catch(e){} }
  else if(key==="="){
    try{
      let result = safeEval(expression);
      if(typeof result === "number" && !Number.isInteger(result)) result = Math.round(result*1e6)/1e6;
      lastAnswer = result;
      history.push(`${expression} = ${result}`);
      updateHistory();
      expression = String(result);
    }catch(e){
      expression = "Error";
    }
  }
  else if(["sin","cos","tan","asin","acos","atan","sinh","cosh","tanh","log","ln","log₂","exp","√","abs","cbrt","sign","floor","ceil","round","min","max","hypot"].includes(key)){
    const names = {"√":"sqrt", "log₂":"log2"};
    expression += (names[key] || key) + "(";
  }
  else if(["AND","OR","XOR","LSH","RSH"].includes(key)){ expression += ` ${key} `; }
  else if(key==="NOT"){
    try{
      const val = Math.trunc(Number(safeEval(expression)));
      expression = String(~val);
    }catch(e){ expression = "Error"; }
  }
  else if(key==="π"){ expression += "π"; }
  else if(key==="e"){ expression += "e"; }
  else if(key==="x²"){ expression += "**2"; }
  else if(key==="x³"){ expression += "**3"; }
  else if(key==="10ˣ"){ expression += "10**("; }
  else if(key==="2ˣ"){ expression += "2**("; }
  else if(key==="1/x"){
    try{
      const value = Number(safeEval(expression));
      if(value === 0) throw new Error();
      expression = String(Math.round((1/value)*1e10)/1e10);
    }catch(e){ expression = "Error"; }
  }
  else if(key==="±"){
    expression = expression ? `-(${expression})` : "-";
  }
  else if(key==="ans"){ expression += String(lastAnswer); }
  else if(key==="mod"){ expression += " % "; }
  else if(key==="rand"){ expression += String(Math.floor(Math.random()*100)); }
  else if(key==="τ"){ expression += "τ"; }
  else if(key==="φ"){ expression += "φ"; }
  else if(key===","){ expression += ","; }
  else if(key==="π/2"){ expression += "π/2"; }
  else if(key==="deg"){
    try{ expression = String(Math.round((Number(safeEval(expression))*180/Math.PI)*1e10)/1e10); }
    catch(e){ expression = "Error"; }
  }
  else if(key==="rad"){
    try{ expression = String(Math.round((Number(safeEval(expression))*Math.PI/180)*1e10)/1e10); }
    catch(e){ expression = "Error"; }
  }
  else if(key==="n!"){
    try{
      const value = Number(safeEval(expression));
      if(!Number.isInteger(value) || value < 0 || value > 170) throw new Error();
      let result = 1;
      for(let i=2; i<=value; i++) result *= i;
      expression = String(result);
    }catch(e){ expression = "Error"; }
  }
  else if(key==="%"){
    try{
      let val = Number(safeEval(expression));
      let result = val/100;
      if(Number.isInteger(result)) expression = String(result);
      else expression = String(Math.round(result*1e6)/1e6);
    }catch(e){ expression = "Error"; }
  }
  else if(key === "."){
    const currentNumber = expression.split(/[+\-*/%^()\s]/).pop();
    if(!currentNumber.includes(".")) expression += key;
  }
  else { expression += key; }

  setDisplay(expression || "0");
  updateProgDisplay();
  saveState();
}

function convertPress(key){
  playSound((key==="C"||key==="del") ? "clear" : "number");
  const disp = document.getElementById('convDisplay');
  let cur = disp.value;
  if(key==="C") cur = "0";
  else if(key==="del") cur = cur.length>1 ? cur.slice(0,-1) : "0";
  else if(key===".") { if(!cur.includes(".")) cur += "."; }
  else cur = (cur==="0") ? key : cur+key;

function executeConversion(){
  const resEl = document.getElementById('convResult');
  const val = parseFloat(document.getElementById('convDisplay').value);
  if(Number.isNaN(val)){ resEl.textContent = "Invalid number"; return; }
  const choice = document.getElementById('convSelect').value;
  let res;
  switch(choice){
    case "km -> miles": res = val*0.621371; break;
    case "miles -> km": res = val/0.621371; break;
    case "kg -> lb": res = val*2.20462; break;
    case "lb -> kg": res = val/2.20462; break;
    case "C -> F": res = (val*9/5)+32; break;
    case "F -> C": res = (val-32)*5/9; break;
  }
  resEl.textContent = "Result: " + (Math.round(res*10000)/10000);
}

// GRAPH PLOTTING (canvas, replaces matplotlib)
// ==========================================
function plotGraph(){
  playSound("operator");
  const canvas = document.getElementById('graphCanvas');
  const ctx2d = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx2d.clearRect(0,0,w,h);

  const rawText = document.getElementById('display').textContent;
  try{
    // Convert every calculator symbol/function into valid JS, once, up front.
    let js = rawText
      .replace(/\^/g, "**")
      .replace(/√/g, "sqrt")
      .replace(/π/g, "PI")
      .replace(/sin/g,"Math.sin").replace(/cos/g,"Math.cos").replace(/tan/g,"Math.tan")
      .replace(/sqrt/g,"Math.sqrt").replace(/log/g,"Math.log10")
      .replace(/abs/g,"Math.abs")
      .replace(/PI/g,"Math.PI");

    if(js.trim() === "" || js.trim() === "0" || !/x/.test(js)){
      setDisplay("Error: enter an expression with x, e.g. x**2");
      return;
    }

    if(!/^(?:(?:Math\.(?:sin|cos|tan|log10|sqrt|abs|PI))|[0-9+\-*/%.()\s^x])*$/.test(js)) throw new Error("Invalid equation");
    // eslint-disable-next-line no-new-func
    const fn = Function('x', '"use strict"; return (' + js + ')');

    const xs = [], ys = [];
    for(let i=0;i<=400;i++){
      const x = -10 + (20*i/400);
      let y;
      try{ y = fn(x); }catch(e){ y = NaN; }
      xs.push(x); ys.push(Number.isFinite(y) ? y : NaN);
    }
    const validYs = ys.filter(Number.isFinite);
    if(validYs.length === 0){
      setDisplay("Error: Invalid Equation");
      return;
    }
    const yMin = Math.min(...validYs), yMax = Math.max(...validYs);
    const yRange = (yMax-yMin) || 1;

    const toPx = (x,y)=>{
      const px = ((x+10)/20)*w;
      const py = h - ((y-yMin)/yRange)*h;
      return [px,py];
    };

    // gridlines (light, every 2 units of x, and ~5 divisions of y)
    ctx2d.strokeStyle = "rgba(128,128,128,.18)"; ctx2d.lineWidth = 1;
    for(let gx=-10; gx<=10; gx+=2){
      const [px] = toPx(gx,0);
      ctx2d.beginPath(); ctx2d.moveTo(px,0); ctx2d.lineTo(px,h); ctx2d.stroke();
    }
    for(let i=0;i<=4;i++){
      const gy = yMin + (yRange*i/4);
      const [,py] = toPx(0,gy);
      ctx2d.beginPath(); ctx2d.moveTo(0,py); ctx2d.lineTo(w,py); ctx2d.stroke();
    }

    // axes
    ctx2d.strokeStyle = "#999"; ctx2d.lineWidth = 1;
    const [zx] = toPx(0,0); const [,zy] = toPx(0,0);
    ctx2d.beginPath(); ctx2d.moveTo(zx,0); ctx2d.lineTo(zx,h); ctx2d.stroke();
    ctx2d.beginPath(); ctx2d.moveTo(0,zy); ctx2d.lineTo(w,zy); ctx2d.stroke();

    // axis labels
    ctx2d.fillStyle = "rgba(128,128,128,.85)"; ctx2d.font = "9px monospace";
    ctx2d.fillText("-10", 2, h-3);
    ctx2d.fillText("10", w-16, h-3);
    ctx2d.fillText(String(Math.round(yMax*100)/100), 2, 9);
    ctx2d.fillText(String(Math.round(yMin*100)/100), 2, h-12);

    // curve
    ctx2d.strokeStyle = THEMES[currentTheme].btn_eq;
    ctx2d.lineWidth = 2;
    ctx2d.beginPath();
    let started = false;
    xs.forEach((x,i)=>{
      if(!Number.isFinite(ys[i])){ started=false; return; }
      const [px,py] = toPx(x,ys[i]);
      if(!started){ ctx2d.moveTo(px,py); started=true; }
      else ctx2d.lineTo(px,py);
    });
    ctx2d.stroke();
  }catch(e){
    setDisplay("Error: Invalid Equation");
  }
}

// ==========================================
// THEME STUDIO
// ==========================================
const THEME_FIELDS = [
  ["Background (bg)","bg"], ["Display Box (display)","display"], ["Number Buttons (btn)","btn"],
  ["Operator Keys (btn_op)","btn_op"], ["Equals Key (btn_eq)","btn_eq"],
  ["Text Color (fg)","fg"], ["Sidebar Text (label_fg)","label_fg"],
];
let studioColors = {};

function openThemeCreator(){
  playSound("operator");
  studioColors = {...THEMES[currentTheme]};
  document.getElementById('themeNameInput').value = "My Custom Theme";
  const fields = document.getElementById('swatchFields');
  fields.innerHTML = '';
  THEME_FIELDS.forEach(([label,key])=>{
    const row = document.createElement('div');
    row.className = 'swatch-row';
    row.innerHTML = `<span>${label}</span>`;
    const input = document.createElement('input');
    input.type = 'color';
    input.value = studioColors[key];
    input.addEventListener('input', ()=>{
      studioColors[key] = input.value;
      updateStudioPreview();
    });
    row.appendChild(input);
    fields.appendChild(row);
  });
  updateStudioPreview();
  document.getElementById('modalBackdrop').classList.add('open');
}

function updateStudioPreview(){
  const card = document.getElementById('previewCard');
  card.style.background = studioColors.bg;
  const disp = document.getElementById('previewDisp');
  disp.style.background = studioColors.display;
  disp.style.color = studioColors.fg;
  document.getElementById('pB1').style.background = studioColors.btn;
  document.getElementById('pB1').style.color = studioColors.fg;
  document.getElementById('pB2').style.background = studioColors.btn_op;
  document.getElementById('pB2').style.color = studioColors.fg;
  document.getElementById('pB3').style.background = studioColors.btn_eq;
  document.getElementById('pB3').style.color = "#fff";
}

function saveThemeAndApply(){
  const name = document.getElementById('themeNameInput').value.trim();
  if(!name){ alert("Please enter a valid theme name."); return; }
  playSound("equals");
  THEMES[name] = {...studioColors};
  refreshThemeSelect();
  applyTheme(name);
  saveState();
  document.getElementById('modalBackdrop').classList.remove('open');
}

document.getElementById('clearHistoryBtn').addEventListener('click', ()=>{
  history = [];

});
document.getElementById('roastBtn').addEventListener('click', roast);
document.getElementById('copyBtn').addEventListener('click', async ()=>{
  playSound("equals");
  const text = document.getElementById('display').textContent;
  const statusEl = document.getElementById('copyStatus');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      // Fallback for older/insecure contexts
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    statusEl.textContent = "Copied!";
  }catch(e){
    statusEl.textContent = "Copy failed";
  }
  setTimeout(()=>{ statusEl.textContent = ""; }, 1200);
});
document.getElementById('plotBtn').addEventListener('click', plotGraph);

document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "select" || tag === "textarea") return;
  if(document.getElementById('modalBackdrop').classList.contains('open')) return;

  if("0123456789+-*/.%(),".includes(e.key)) press(e.key);
  else if(e.key === "x" || e.key === "X") press("x");
  else if(e.key === "Enter") press("=");
  else if(e.key === "Backspace") press("del");
  else if(e.key === "Escape") press("C");
});

// Esc closes the theme studio modal too
document.addEventListener('keydown', e=>{
  if(e.key === "Escape") document.getElementById('modalBackdrop').classList.remove('open');
});

const KONAMI_SEQUENCE = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
let konamiProgress = [];

function unlockSecretTheme(){
  THEMES["??? Secret Mode"] = {...SECRET_THEME};
  refreshThemeSelect();
  applyTheme("??? Secret Mode");
  playSound("equals");
  setDisplay("You found the secret. Respect.");
  expression = "";
}

document.addEventListener('keydown', e=>{
  const expected = KONAMI_SEQUENCE[konamiProgress.length];
  if(e.key === expected){
    konamiProgress.push(e.key);
    if(konamiProgress.length === KONAMI_SEQUENCE.length){
      konamiProgress = [];
      unlockSecretTheme();
    }
  } else {
    konamiProgress = (e.key === KONAMI_SEQUENCE[0]) ? [e.key] : [];
  }
});
